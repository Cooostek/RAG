#Что тут происходит??

#Запуск зависимостей: сначала поднимаются etcd и MinIO.
#Запуск Milvus: подключается к etcd (метаданные) и MinIO (данные), становится доступным на порту 19530.
#Запуск scheduler: ждёт готовности Milvus, запускает индексацию документов (создаёт векторы и загружает в Milvus).
#Запуск backend: подключается к Milvus (поиск) и Ollama (генерация), предоставляет API на порту 5000.
#Запуск frontend: подключается к бэкенду, отображает веб‑интерфейс на порту 5173.


services:
#распределённое хранилище ключей‑значений для координации (крч метаданные)
  etcd:
    image: quay.io/coreos/etcd:v3.5.0
    environment:
      ETCD_AUTO_COMPACTION_MODE: revision
      ETCD_AUTO_COMPACTION_RETENTION: "1000"
      #лимит хранения 4гб
      ETCD_QUOTA_BACKEND_BYTES: "4294967296"
    command:
      - etcd
      - -listen-client-urls=http://0.0.0.0:2379
      - -advertise-client-urls=http://etcd:2379
    ports:
      - "2379:2379"
    volumes:
      - etcd_data:/etcd
    restart: unless-stopped

#объектное хранилище (аналог AWS S3) (хранит файлы, индексы)
  minio:
    image: minio/minio:RELEASE.2023-01-12T02-06-16Z
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    command: server /data
    ports:
      - "9000:9000"
    volumes:
      - minio_data:/data
    restart: unless-stopped

#векторная БД
  standalone:
    #Всё в одном процессе
    image: milvusdb/milvus:v2.4.15
    command: ["milvus", "run", "standalone"]
    environment:
      ETCD_ENDPOINTS: etcd:2379
      MINIO_ADDRESS: minio:9000
    ports:
      - "19530:19530"
      - "9091:9091"
    depends_on:
      - etcd
      - minio
    volumes:
      - milvus_data:/var/lib/milvus
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9091/healthz"]
      interval: 5s
      timeout: 3s
      retries: 40
      start_period: 10s
    restart: unless-stopped

#основной API‑сервер приложения (обработка запросов + милвус и оллама)
  backend:
    build: ./backend
    container_name: rag_backend
    env_file: .env
    environment:
      - OLLAMA_BASE_URL=${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
      #модель по умолчанию (лучше поставить поумнее по типу квепнкодера и др)
      - OLLAMA_MODEL=${OLLAMA_MODEL:-llama3.2:3b}
      - OLLAMA_TIMEOUT=${OLLAMA_TIMEOUT:-180}
    #проброс API‑порта
    ports:
      - "5000:5000"
    #монтирование папок с данными и кодом
    volumes:
      - ./data:/app/data
      - ./backend/app:/app/app
    #запускается после милвуса
    depends_on:
      - standalone

#сервис фоновых задач (индексация, эмбединги)
  scheduler:
    build:
      context: ./scheduler
    container_name: rag_scheduler
    working_dir: /app
    env_file: .env
    volumes:
      - .:/app
      - ./data:/app/data
    environment:
      PYTHONPATH: /app/backend:/app
      PYTHONUNBUFFERED: "1"
      # если хотите чтобы при каждом старте делал полный reindex:
      # FORCE_REINDEX: "true"
    command: python scheduler/run_scheduler.py
    #Ждем норм реакции милвуса
    depends_on:
      standalone:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    build: ./frontend
    #просто имя контейнера
    container_name: rag_frontend
    ports:
      - "5173:5173"
    environment:
      VITE_API_URL: http://localhost:5000
    #монтирование кода для горячей перезагрузки
    #Горячая перезагрузка — механизм, позволяющий автоматически применять изменения в коде приложения без перезапуска контейнера. 
    #При сохранении файла на локальной машине он мгновенно обновляется внутри контейнера, а фреймворк (React, Vue, Node.js и т. д.) автоматически перезапускает приложение.
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      backend:
        condition: service_started
    restart: unless-stopped

volumes:
  etcd_data:
  minio_data:
  milvus_data: